services:
  - type: web
    name: gestao-equipe-amanda
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-amanda-db
          property: connectionString
databases:
  - name: gestao-amanda-db
    plan: free
    databaseName: ricos
    user: ricos
